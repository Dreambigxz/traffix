          <div class="main-page">
            <div class="wrap">
              <div class="logo">
                <img src="assets/images/logo.png" class="light-mode-logo" alt="" title="">
              </div>
              <div class="auth-heading">
                <span class="auth-badge">WELCOME BACK - <small>Login</small></span>
              </div>
              <div class="main-area">

                <form
                  class="list"
                  [formGroup]="authService.formView.login"
                  (ngSubmit)="authService.onSubmit(authService.formView.login,'login')">

                  <ul>
                    <li class="item-content item-input">
                      <div class="item-inner">
                        <div class="item-input-wrap">
                          <input
                         formControlName="identifier"
                          type="text"
                          placeholder="Username /  Email ">
                          <i class="bi bi-person"></i>
                        </div>
                      </div>
                    </li>

                    <li class="item-content item-input">
                      <div class="item-inner">
                        <div class="item-input-wrap">
                          <input
                            formControlName='password'
                            [type]="authService.showPassword ? 'text' : 'password'"
                            placeholder="Password"
                            autocomplete='password'>
                            <i
                              class="bi"
                              [ngClass]="authService.showPassword ? 'bi-eye-slash' : 'bi-eye'"
                              (click)="authService.togglePassword()">
                            </i>

                        </div>
                      </div>
                    </li>

                  </ul>
                  <div class="signup">
                    <span (click)="authService.mode='reset'" class="log-title" title="">Forgot Password?</span>
                    <button
                      type="submit"
                      class="list-button"
                      title=""
                      [disabled]="authService.formView.login.invalid">

                      Log In

                    </button>
                    <div class="signin-up or-text">or</div>
                  </div>

                    <button type="button" class="google-login-btn" (click)="authService.loginWithGoogle()">

                      <span>Continue with Google</span>
                    </button>
                  </div> -->
                </form>
              </div>
              <div class="login-footer" >
                <p>Don’t have an account?</p>
                <span class="log-title" (click)="authService.mode='register'" >Register Here</span>
              </div>
            </div>
          </div>
