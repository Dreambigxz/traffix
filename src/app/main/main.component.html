
<app-use-guide/>

<app-news-header
  [userName]="quickNav.storeData.get('username') || ''"
  [quickNav]="quickNav"
  [unreadNotificationsCount]="quickNav.storeData.store['Totalunread'] ||  0"
  />
<app-sliders/>


<nav
  class="home-quick-navigation container"
  aria-label="Wallet quick actions"
>
  <a
    class="quick-navigation-item deposit"
    routerLink="/wallet/deposit"
  >
    <span class="quick-navigation-icon">
      <i
        class="bi bi-wallet2"
        aria-hidden="true"
      ></i>
    </span>

    <span class="quick-navigation-copy">
      <strong>Deposit</strong>
      <small>Add funds</small>
    </span>

    <i
      class="bi bi-chevron-right arrow"
      aria-hidden="true"
    ></i>
  </a>

  <a
    class="quick-navigation-item withdraw"
    routerLink="/wallet/withdraw"
  >
    <span class="quick-navigation-icon">
      <i
        class="bi bi-box-arrow-up"
        aria-hidden="true"
      ></i>
    </span>

    <span class="quick-navigation-copy">
      <strong>Withdraw</strong>
      <small>Cash out</small>
    </span>

    <i
      class="bi bi-chevron-right arrow"
      aria-hidden="true"
    ></i>
  </a>

  <a
    class="quick-navigation-item rewards"
    routerLink="wallet/transactions"
  >
    <span class="quick-navigation-icon">
      <i
        class="bi bi-receipt"
        aria-hidden="true"
      ></i>
    </span>

    <span class="quick-navigation-copy">
      <strong>Transactions</strong>
      <small>View wallet history</small>
    </span>

    <i
      class="bi bi-chevron-right arrow"
      aria-hidden="true"
    ></i>
  </a>
</nav>

<app-news-categories-nav/>

<app-mobile-menu  />
