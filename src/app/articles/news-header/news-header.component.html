
<header class="app-header">

  <!-- TOP ROW -->
  <div class="header-top">

    <!-- BRAND -->
    <div class="brand">
      <div class="logo">
        <span class="logo-dark">Traffi</span><span class="logo-red">X</span>
      </div>

      <span class="tagline">Engage. <span style="color:var(--primary)"> Explore.</span> Earn</span>
    </div>

    <!-- ACTIONS -->
    <div class="header-actions">

        <!-- TELEGRAM -->
        <a
          class="header-icon-btn telegram-btn"
          href="https://t.me/+dElfIGdBEZk5MmM8"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Join our Telegram"
          title="Join our Telegram"
        >
          <i class="bi bi-telegram"></i>
        </a>

        <!-- NOTIFICATIONS -->
        <button
          class="header-icon-btn notification-btn"
          type="button"
          (click)="onNotificationClick()"
          aria-label="Notifications"
        >
          <i class="bi bi-bell"></i>

          <span
            *ngIf="unreadNotificationsCount > 0"
            class="notification-badge"
          >
            {{ unreadNotificationsCount > 9 ? '9+' : unreadNotificationsCount }}
          </span>
        </button>

        <!-- LOGOUT -->
        <button
          class="header-icon-btn logout-btn"
          type="button"
          (click)="quickNav.authService.logout(false)"
          aria-label="Log out"
        >
          <i class="bi bi-box-arrow-right"></i>
        </button>

      </div>

  </div>


  <!-- BOTTOM ROW -->
  <div class="header-bottom">

    <!-- USER INFORMATION -->
    <div class="user-info">

      <div class="user-greeting">
        <span class="greeting-text">{{ getGreeting }},</span>

        <strong class="user-name">
          {{ userName }}
        </strong>
      </div>

      <!-- BRAZIL TIME -->
      <div class="server-time">

        <span class="server-indicator"></span>

        <span class="server-time-label">BR</span>

        <span class="server-time-value">
          {{ getCurrentDateTime }}
        </span>

      </div>

    </div>


    <!-- WALLET BALANCE -->
    <button
      class="header-balance"
      type="button"
      (click)="quickNav.go('/wallet/deposit')"
      aria-label="Open wallet deposit"
    >

      <span class="header-balance__icon">
        <i class="bi bi-wallet2"></i>
      </span>

      <span class="header-balance__details">

        <small>Balance</small>

        <strong>
          {{
            (quickNav.storeData.get('wallet')?.balance || 0)
              | number:'1.2-2'
          }}
        </strong>

      </span>

      <i class="bi bi-chevron-right balance-arrow"></i>

    </button>

  </div>

</header>
