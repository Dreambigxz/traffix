<header class="app-header">
  <!-- Top Bar: Action Buttons -->
  <div class="top-bar">


    <div class="top-right">
      <!-- <button class="icon-btn" (click)="onSearch()" aria-label="Search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button> -->

      <button class="icon-btn" (click)="onNotificationClick()" aria-label="Notifications">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span  class="badge">
          {{ unreadNotificationsCount > 9 ? '9+' : unreadNotificationsCount }}

        </span>
      </button>

      <button
        class="icon-btn logout-button"
        type="button"
        (click)="quickNav.authService.logout(false)"
        aria-label="Log out"
        title="Log out"
      >
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>

    </div>

    <div class="top-left">
        <div class="header-balance" aria-label="Available balance">
          <span class="header-balance__icon">
            <i class="bi bi-wallet2"></i>
          </span>

          <div (click)="quickNav.go('/wallet/deposit')" class="header-balance__details">
            <!-- <small>Balance</small> -->

            <strong>
              {{ (quickNav.storeData.get('wallet')?.balance || 0) |number:'1.2-2'
              }}
            </strong>
          </div>
        </div>


      </div>
  </div>

  <!-- Main Side-by-Side Content -->
  <div class="main-row">
    <!-- Brand Logo -->
    <div class="brand">
      <div class="logo">
        <span class="logo-dark">Traffi</span><span class="logo-red">X</span>
      </div>
      <div class="tagline">Engage. Explore. Earn</div>
    </div>

    <!-- User Greeting -->
    <div class="greeting-box">
      <span class="greeting-text">{{getGreeting}},</span>
      <span class="user-name text-width-150">
        <i class="bi bi-person"></i>{{ userName }}
      </span>
      <span class="date-text">{{ getCurrentDateTime }}</span>
    </div>
  </div>
</header>
